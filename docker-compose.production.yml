## Heartbeat – Production stack for Raspberry Pi 5
## Usage:
##   docker compose -f docker-compose.production.yml up -d --build
##
## Ollama runs natively on the host (not in Docker) for direct ARM64 access.
## Install: curl -fsSL https://ollama.com/install.sh | sh
## Then:    ollama pull qwen2.5:1.5b

services:
  # ── PostgreSQL with pgvector ──────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: heartbeat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heartbeat}
      POSTGRES_USER: ${POSTGRES_USER:-heartbeat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - heartbeat_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heartbeat} -d ${POSTGRES_DB:-heartbeat}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Limit memory on Pi – Postgres doesn't need much for this workload
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis for BullMQ job queue ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: heartbeat-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - heartbeat_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M

  # ── Heartbeat web server ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heartbeat-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-heartbeat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-heartbeat}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Background worker (Intercom sync + Ollama ticker rewrite) ────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heartbeat-worker
    restart: unless-stopped
    command: ["npx", "tsx", "jobs/index.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-heartbeat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-heartbeat}
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      INTERCOM_ACCESS_TOKEN: ${INTERCOM_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  heartbeat_postgres_data:
  heartbeat_redis_data:
