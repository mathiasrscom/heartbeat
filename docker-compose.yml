services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: heartbeat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heartbeat}
      POSTGRES_USER: ${POSTGRES_USER:-heartbeat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heartbeat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - heartbeat_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-heartbeat} -d ${POSTGRES_DB:-heartbeat}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  heartbeat_postgres_data:
